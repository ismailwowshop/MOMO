name: Update MOMO IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update MOMO HLS
        run: python scripts/update_momo.py

      - name: Commit changed playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MOMO.w3u
          if git diff --cached --quiet; then
            echo "No stream URL change."
          else
            git commit -m "Auto-update MOMO IPTV streams"
            git push
          fi
